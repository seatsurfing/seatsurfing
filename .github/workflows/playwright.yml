name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  container-job:
    name: Run Playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: seatsurfing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json

      - name: Build UI
        working-directory: ./ui
        run: npm ci && npm run build

      - name: Install server dependencies
        working-directory: ./server
        run: go mod download
      - name: Build server
        working-directory: ./server
        run: go build -buildvcs=false -o ./seatsurfing .
      - uses: JarvusInnovations/background-action@v2
        name: Run server in background
        with:
          working-directory: ./server
          run: STATIC_UI_PATH=../ui/build PUBLIC_SCHEME=http PUBLIC_LISTEN_ADDR=0.0.0.0:8080 POSTGRES_URL=postgres://postgres:root@localhost/seatsurfing_test?sslmode=disable CRYPT_KEY=rC8REJftxMcdhzTvu9Tk6RqgygBRctZC ./seatsurfing
          wait-on: http-get://localhost:8080/auth/singleorg
          wait-for: 60s

      - name: Install dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright Browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright tests
        working-directory: ./e2e
        run: UI_URL="http://localhost:8080" npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
