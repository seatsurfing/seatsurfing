      operationId: createSpaceAttribute
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceAttributeRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /space-attribute/{id}:
    get:
      tags: [Space Attributes]
      summary: Get a space attribute
      description: Returns a single space attribute definition by ID.
      operationId: getSpaceAttribute
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Space attribute details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSpaceAttributeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Space Attributes]
      summary: Update a space attribute
      description: Updates an existing space attribute definition. Requires `space_attributes` at full access.
      operationId: updateSpaceAttribute
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceAttributeRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
