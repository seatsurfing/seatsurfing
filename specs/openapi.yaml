openapi: 3.1.0
info:
  title: Seatsurfing REST API
  description: |
    Seatsurfing provides REST APIs used by the mobile and web app as well as the administrator web interface.

    ## Authorization checks

    Each API endpoint is protected by authorization checks:
    1. **Permission check**: the permissions granted by the roles assigned to the calling user
    2. **Organization check**: organization membership - no request reaches data belonging to another organization

    ## Permissions

    Access is granted by roles, which an organization's administrators define. A role grants each
    functionality at a level, and a user may hold several roles, holding the highest level any of
    them grants.

    Levels: `0` no access, `10` read only, `20` limited, `30` full access. Not every level is
    meaningful for every permission; `GET /role/permissions` reports the levels each one offers.

    Permission keys: `areas`, `space_attributes`, `bookings`, `approvals`, `analytics`, `users`,
    `groups`, `roles`, `service_accounts`, `auth_providers`, `org_settings`, `audit_log`.
    Plugins contribute further keys prefixed with `plugin.`.

    Every authenticated user, whatever roles they hold, can always manage their own bookings,
    buddies, preferences and profile, and read the areas and spaces available to them. Endpoints
    covering that baseline require no particular permission.

    An organization always retains at least one user who can manage both roles and users;
    a request that would remove the last such user is refused with error code 7001.

    ## Authentication

    Authentication is done via JWT Bearer tokens in the `Authorization` header. Service accounts may also use HTTP Basic Authentication (`Authorization: Basic <base64>`) or a long-lived API token (`Authorization: Bearer <token>`) generated via `POST /user/{id}/api-token`. API tokens are stored as SHA-256 hashes and are shown only once at generation time.

    ## Session management

    - Access Token Lifetime: 15 minutes
    - Refresh Token Lifetime: 28 days
    - Tokens are signed using RS512

    ## Custom error codes

    Some endpoints return custom error codes via the `X-Error-Code` response header:
    - `1001`: Booking slot conflict
    - `1002`: Location max concurrent bookings reached
    - `1003`: Too many upcoming bookings for user
    - `1004`: Too many days in advance
    - `1005`: Invalid booking duration
    - `1006`: Max concurrent bookings for user reached
    - `1007`: Invalid minimum booking duration
    - `1008`: Max hours before delete restriction
    - `1009`: User not allowed to book this space
    - `1010`: Booking subject required
    - `1011`: Booking in past
    - `2001`: Presence report date range too long
    - `3001`: User already exists
    - `4001`: Group name already exists
    - `5001`: Password update required
    - `6001`: Auth provider name already exists
    - `7001`: The change would leave the organization without an administrator
    - `7002`: Cannot grant access you do not hold yourself
    - `7003`: The built-in administrator role cannot be changed
    - `7004`: Cannot remove your own ability to manage roles
    - `7005`: Role name already exists
  version: 1.60.0
  license:
    name: MIT
    url: https://github.com/seatsurfing/seatsurfing/blob/main/LICENSE

servers:
  - url: /
    description: Relative to the Seatsurfing instance

tags:
  - name: Authentication
    description: Login, logout, password reset, token refresh, and OAuth flows
  - name: Bookings
    description: Create, read, update, and delete bookings
  - name: Recurring Bookings
    description: Create and manage recurring bookings
  - name: Locations
    description: Manage locations (areas/floors)
  - name: Spaces
    description: Manage spaces (desks/rooms) within locations
  - name: Space Attributes
    description: Manage space attribute definitions
  - name: Organizations
    description: Manage organizations and their domains
  - name: Users
    description: Manage users, passwords, TOTP and passkeys
  - name: Groups
    description: Manage user groups and memberships
  - name: Roles
    description: Define roles and assign them to users
  - name: Buddies
    description: Manage buddy relationships
  - name: Auth Providers
    description: Manage OAuth/OIDC authentication providers
  - name: Auth Events
    description: Browse recorded authentication events (login successes and failures)
  - name: Settings
    description: Get and set organization settings
  - name: User Preferences
    description: Get and set user preferences (CalDAV, colors, etc.)
  - name: Statistics
    description: Organization statistics and reports
  - name: Search
    description: Global search across users, locations, spaces, and groups
  - name: Confluence
    description: Atlassian Confluence SSO integration
  - name: Healthcheck
    description: Application health check
  - name: Update Check
    description: Check for available updates

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained via login or refresh endpoints
    BasicAuth:
      type: http
      scheme: basic
      description: Service account authentication using `{orgId}_{email}` as username and the service account password
    ServiceAccountBearerAuth:
      type: http
      scheme: bearer
      description: Service account authentication using a long-lived API token generated via `POST /user/{id}/api-token`. The raw token is presented as a Bearer token. Read-only service accounts may only use this on `GET` requests.

  schemas:
    # --- Authentication ---
    AuthPasswordRequest:
      type: object
      required: [email, password, organizationId]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 64
        organizationId:
          type: string
          format: uuid
        code:
          type: string
          description: TOTP code for 2FA (required if TOTP is enabled for the user)
        passkeyStateId:
          type: string
          description: State ID from a passkey challenge
        passkeyCredential:
          type: object
          description: Passkey credential response

    JWTResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (15 min lifetime)
        refreshToken:
          type: string
          description: Refresh token ID (28 day lifetime)
        logoutUrl:
          type: string
          description: IdP logout URL (only for OAuth logins)
        profilePageUrl:
          type: string
          description: IdP profile page URL (only for OAuth logins)

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthPreflightResponse:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/GetOrganizationResponse"
        authProviders:
          type: array
          items:
            $ref: "#/components/schemas/GetAuthProviderPublicResponse"
        requirePassword:
          type: boolean
          description: Whether any user has a password set
        disablePasswordLogin:
          type: boolean
          description: Whether password login is disabled globally
        domain:
          type: string
          description: Primary domain of the organization

    InitPasswordResetRequest:
      type: object
      required: [organizationId, email]
      properties:
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254

    CompletePasswordResetRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 64

    # --- Bookings ---
    CreateBookingRequest:
      type: object
      required: [spaceId, enter, leave]
      properties:
        spaceId:
          type: string
          format: uuid
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time
        subject:
          type: string
        userEmail:
          type: string
          format: email
          description: Email of the user to book for. Requires `bookings` at full access.

    GetBookingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
        approved:
          type: boolean
        spaceId:
          type: string
          format: uuid
        subject:
          type: string
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time
        recurringId:
          type: string
        space:
          $ref: "#/components/schemas/GetSpaceResponse"

    PreCreateBookingRequest:
      type: object
      required: [locationId, enter, leave]
      properties:
        locationId:
          type: string
          format: uuid
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time

    SetBookingApprovalRequest:
      type: object
      properties:
        approved:
          type: boolean

    GetPendingApprovalsCountResponse:
      type: object
      properties:
        count:
          type: integer

    GetPresenceReportResult:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/GetUserInfoSmall"
        dates:
          type: array
          items:
            type: string
        presences:
          type: array
          items:
            type: array
            items:
              type: integer

    GetUserInfoSmall:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email

    # --- Recurring Bookings ---
    CreateRecurringBookingRequest:
      type: object
      required: [spaceId, enter, leave, end, cadence, cycle]
      properties:
        spaceId:
          type: string
          format: uuid
        subject:
          type: string
        enter:
          type: string
          format: date-time
          description: Start time of the first booking
        leave:
          type: string
          format: date-time
          description: End time of the first booking
        end:
          type: string
          format: date-time
          description: End date of the recurrence
        cadence:
          type: integer
          minimum: 1
          maximum: 2
          description: "1 = weekly, 2 = daily"
        cycle:
          type: integer
          minimum: 1
          description: "Repeat every N weeks/days"
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: "Weekdays (0=Sunday..6=Saturday), used with weekly cadence"

    CreateRecurringBookingResponse:
      type: object
      properties:
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time
        success:
          type: boolean
        errorCode:
          type: integer
        id:
          type: string
          format: uuid

    GetRecurringBookingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        subject:
          type: string
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        cadence:
          type: integer
        cycle:
          type: integer
        weekdays:
          type: array
          items:
            type: integer

    # --- Locations ---
    CreateLocationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        maxConcurrentBookings:
          type: integer
        timezone:
          type: string
          description: IANA timezone (e.g. "Europe/Berlin")
        enabled:
          type: boolean
        mapScale:
          type: number
          format: double

    GetLocationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        maxConcurrentBookings:
          type: integer
        timezone:
          type: string
        enabled:
          type: boolean
        mapScale:
          type: number
          format: double
        mapWidth:
          type: integer
        mapHeight:
          type: integer
        mapMimeType:
          type: string

    GetMapResponse:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
        scale:
          type: number
          format: double
        mimeType:
          type: string
        data:
          type: string
          format: byte
          description: Base64-encoded image data

    SearchLocationRequest:
      type: object
      required: [enter, leave]
      properties:
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/SearchAttribute"

    SearchAttribute:
      type: object
      properties:
        attributeId:
          type: string
        comparator:
          type: string
          enum: [eq, neq, contains, ncontains, gt, lt, gte, lte]
        value:
          type: string

    # --- Spaces ---
    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        x:
          type: integer
          description: X position on the location map
        "y":
          type: integer
          description: Y position on the location map
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
        requireSubject:
          type: boolean
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/SpaceAttributeValueRequest"
        approverGroupIds:
          type: array
          items:
            type: string
            format: uuid
        allowedBookerGroupIds:
          type: array
          items:
            type: string
            format: uuid

    SpaceAttributeValueRequest:
      type: object
      properties:
        attributeId:
          type: string
          format: uuid
        value:
          type: string

    GetSpaceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        available:
          type: boolean
        name:
          type: string
        x:
          type: integer
        "y":
          type: integer
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
        requireSubject:
          type: boolean
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/SpaceAttributeValueRequest"
        approverGroupIds:
          type: array
          items:
            type: string
        allowedBookerGroupIds:
          type: array
          items:
            type: string
        location:
          $ref: "#/components/schemas/GetLocationResponse"

    GetSpaceAvailabilityResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        available:
          type: boolean
        name:
          type: string
        x:
          type: integer
        "y":
          type: integer
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
        requireSubject:
          type: boolean
        allowed:
          type: boolean
          description: Whether the authenticated user is allowed to book this space
        approvalRequired:
          type: boolean
          description: Whether booking this space requires approval
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/GetSpaceAvailabilityBookingsResponse"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/SpaceAttributeValueRequest"

    GetSpaceAvailabilityBookingsResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recurringId:
          type: string
        userId:
          type: string
          format: uuid
          description: Only visible if showNames is enabled or it's the user's own booking
        userEmail:
          type: string
          format: email
          description: Only visible if showNames is enabled or it's the user's own booking
        userFirstname:
          type: string
          description: Only visible if showNames is enabled or it's the user's own booking
        userLastname:
          type: string
          description: Only visible if showNames is enabled or it's the user's own booking
        enter:
          type: string
          format: date-time
        leave:
          type: string
          format: date-time
        subject:
          type: string
        approved:
          type: boolean

    SpaceBulkUpdateRequest:
      type: object
      properties:
        creates:
          type: array
          items:
            $ref: "#/components/schemas/CreateSpaceRequest"
        updates:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CreateSpaceRequest"
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
        deleteIds:
          type: array
          items:
            type: string
            format: uuid

    BulkUpdateResponse:
      type: object
      properties:
        creates:
          type: array
          items:
            $ref: "#/components/schemas/BulkUpdateItemResponse"
        updates:
          type: array
          items:
            $ref: "#/components/schemas/BulkUpdateItemResponse"
        deletes:
          type: array
          items:
            $ref: "#/components/schemas/BulkUpdateItemResponse"

    BulkUpdateItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        success:
          type: boolean

    # --- Space Attributes ---
    CreateSpaceAttributeRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
        type:
          type: integer
          description: "Setting type: 1=int, 2=bool, 3=string"
        spaceApplicable:
          type: boolean
        locationApplicable:
          type: boolean

    GetSpaceAttributeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        label:
          type: string
        type:
          type: integer
        spaceApplicable:
          type: boolean
        locationApplicable:
          type: boolean

    SetSpaceAttributeValueRequest:
      type: object
      properties:
        value:
          type: string

    GetSpaceAttributeValueResponse:
      type: object
      properties:
        attributeId:
          type: string
          format: uuid
        value:
          type: string

    # --- Organizations ---
    CreateOrganizationRequest:
      type: object
      required: [name, firstname, lastname, email, language]
      properties:
        name:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
        language:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 639-1 language code (e.g. "en", "de")

    GetOrganizationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
        language:
          type: string

    GetDomainResponse:
      type: object
      properties:
        domain:
          type: string
        active:
          type: boolean
        verifyToken:
          type: string
        primary:
          type: boolean
        accessible:
          type: boolean
        accessCheck:
          type:
            - string
            - "null"
          format: date-time

    ChangeOrgEmailResponse:
      type: object
      properties:
        verifyUuid:
          type: string
          description: UUID of the verification state (empty if no verification needed)

    ChangeEmailAddressVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit numeric verification code

    CompleteOrgDeletionRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit numeric confirmation code

    DeleteOrgResponse:
      type: object
      properties:
        code:
          type: string
          description: 6-digit confirmation code sent via email

    DomainAccessibilityPayload:
      type: object
      properties:
        domain:
          type: string
        orgId:
          type: string
          format: uuid
        status:
          type: string

    # --- Users ---
    CreateUserRequest:
      type: object
      required: [email, firstname, lastname]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        firstname:
          type: string
          maxLength: 128
        lastname:
          type: string
          maxLength: 128
        atlassianId:
          type: string
        role:
          type: integer
          description: "0=User, 1=SpaceAdmin, 2=OrgAdmin, 3=SuperAdmin, 50=ServiceAccountRO, 51=ServiceAccountRW"
        authProviderId:
          type: string
          format: uuid
        password:
          type: string
          description: Set initial password (alternative to sendInvitation)
        sendInvitation:
          type: boolean
          description: Send email invitation to set password
        organizationId:
          type: string
          format: uuid
          description: Must be the caller's own organization. Creating users elsewhere is not possible.

    GetUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstname:
          type: string
        lastname:
          type: string
        atlassianId:
          type: string
        role:
          type: integer
        authProviderId:
          type: string
          format: uuid
        requirePassword:
          type: boolean
          description: Whether user has a password set
        passwordPending:
          type: boolean
          description: Whether user needs to set password via invitation
        spaceAdmin:
          type: boolean
        admin:
          type: boolean
          description: Organization admin
        superAdmin:
          type: boolean
        totpEnabled:
          type: boolean
        hasPasskeys:
          type: boolean
        organization:
          $ref: "#/components/schemas/GetOrganizationResponse"
        lastActivity:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the user's last activity

    GetUserSelfResponse:
      description: User details returned for the authenticated user's own account.
      allOf:
        - $ref: "#/components/schemas/GetUserResponse"
        - type: object
          properties:
            isPrimaryDomain:
              type: boolean
              description: Whether the request's host matches the organization's primary domain

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 64

    GetUserCountResponse:
      type: object
      properties:
        count:
          type: integer

    GetSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        device:
          type: string
        created:
          type: string
          format: date-time

    InitMergeUsersRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    GetMergeRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email

    GenerateTotpResponse:
      type: object
      properties:
        image:
          type: string
          description: Base64-encoded PNG of the TOTP QR code
        stateId:
          type: string
          format: uuid
          description: State ID for the TOTP setup flow

    GetTotpSecretResponse:
      type: object
      properties:
        secret:
          type: string
          description: TOTP secret key for manual entry

    GenerateApiTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Raw API token (64-character lowercase hex string). Shown once only — store it securely.
          example: "a3f1e2d4c5b6a7f8e9d0c1b2a3f4e5d6c7b8a9f0e1d2c3b4a5f6e7d8c9b0a1f2"

    GetApiTokenStatusResponse:
      type: object
      properties:
        configured:
          type: boolean
          description: Whether a long-lived API token is currently configured for this service account.

    ValidateTotpRequest:
      type: object
      required: [code, stateId]
      properties:
        code:
          type: string
          description: 6-digit TOTP code
          minLength: 6
          maxLength: 6
        stateId:
          type: string
          format: uuid

    # --- Passkeys ---
    BeginPasskeyLoginRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid

    BeginPasskeyLoginResponse:
      type: object
      properties:
        stateId:
          type: string
          format: uuid
        challenge:
          type: object
          description: WebAuthn PublicKeyCredentialRequestOptions

    FinishPasskeyLoginRequest:
      type: object
      required: [stateId, credential]
      properties:
        stateId:
          type: string
          format: uuid
        credential:
          type: object
          description: WebAuthn AuthenticatorAssertionResponse

    PasskeyListItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time

    BeginPasskeyRegistrationResponse:
      type: object
      properties:
        stateId:
          type: string
          format: uuid
        challenge:
          type: object
          description: WebAuthn PublicKeyCredentialCreationOptions

    FinishPasskeyRegistrationRequest:
      type: object
      required: [stateId, name, credential]
      properties:
        stateId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        credential:
          type: object
          description: WebAuthn AuthenticatorAttestationResponse

    RenamePasskeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255

    # --- Groups ---
    AuthProviderMapping:
      type: object
      required: [claimValue, targetType, targetId]
      properties:
        claimValue:
          type: string
          maxLength: 512
          description: The group as the identity provider reports it, matched in full. Keycloak paths include the leading slash, for example "/engineering/backend".
        targetType:
          type: string
          enum: [role, group]
        targetId:
          type: string
          format: uuid
          description: The role or group to grant. Must belong to the provider's organization.

    PermissionMap:
      type: object
      description: |
        Access keyed by permission name. Levels are 0 no access, 10 read only, 20 limited,
        30 full access. Permissions the user does not hold are absent rather than zero.
      additionalProperties:
        type: integer
      example:
        groups: 30
        users: 10

    GetPermissionDefinitionResponse:
      type: object
      properties:
        key:
          type: string
          description: 'Permission name, for example "groups". Plugin permissions are prefixed with "plugin.".'
        allowedLevels:
          type: array
          description: The levels this permission may be granted at. Only these are meaningful for it.
          items:
            type: integer
        pluginId:
          type: string
          description: Empty for built-in permissions; otherwise the plugin contributing it.

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 512
        permissions:
          $ref: "#/components/schemas/PermissionMap"

    GetRoleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        system:
          type: boolean
          description: System roles cannot be edited or deleted. Every organization has exactly one.
        permissions:
          $ref: "#/components/schemas/PermissionMap"

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3

    GetGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string

    # --- Buddies ---
    CreateBuddyRequest:
      type: object
      required: [buddyId]
      properties:
        buddyId:
          type: string
          format: uuid

    GetBuddyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buddyId:
          type: string
          format: uuid
        buddyEmail:
          type: string
          format: email
        buddyFirstBooking:
          oneOf:
            - type: object
              properties:
                enter:
                  type: string
                  format: date-time
                leave:
                  type: string
                  format: date-time
                desk:
                  type: string
                room:
                  type: string
            - type: "null"

    # --- Auth Providers ---
    CreateAuthProviderRequest:
      type: object
      required:
        [
          name,
          providerType,
          authUrl,
          tokenUrl,
          scopes,
          userInfoUrl,
          userInfoEmailField,
          clientId,
          clientSecret,
        ]
      properties:
        name:
          type: string
        providerType:
          type: integer
        authUrl:
          type: string
          format: uri
        tokenUrl:
          type: string
          format: uri
        authStyle:
          type: integer
        scopes:
          type: string
          description: Comma-separated list of OAuth scopes
        userInfoUrl:
          type: string
          format: uri
        userInfoEmailField:
          type: string
        userInfoFirstnameField:
          type: string
        userInfoGroupsField:
          type: string
          maxLength: 256
          description: Name of the claim listing the user's groups, used to assign roles and group memberships automatically. Empty disables it.
        userInfoLastnameField:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        logoutUrl:
          type: string
          format: uri
          description: "Supports placeholder: {logoutRedirectUri}"
        profilePageUrl:
          type: string
          format: uri

    GetAuthProviderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        readOnly:
          type: boolean
          description: Whether this provider was auto-configured and cannot be edited
        name:
          type: string
        providerType:
          type: integer
        authUrl:
          type: string
        tokenUrl:
          type: string
        authStyle:
          type: integer
        scopes:
          type: string
        userInfoUrl:
          type: string
        userInfoEmailField:
          type: string
        userInfoFirstnameField:
          type: string
        userInfoLastnameField:
          type: string
        clientId:
          type: string
        logoutUrl:
          type: string
        profilePageUrl:
          type: string

    GetAuthProviderPublicResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # --- Auth Events ---
    GetAuthAttemptResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: ID of the affected user (empty if the user could not be resolved, e.g. unknown email address)
        email:
          type: string
          description: Attempted login identifier
        timestamp:
          type: string
          format: date-time
        successful:
          type: boolean
        method:
          type: string
          description: Authentication method (empty for legacy records)
          enum: ["", password, totp, passkey, passkey_2fa, oauth, confluence]
        authProviderId:
          type: string
          format: uuid
          description: Auth provider ID (only for IdP logins)
        authProviderName:
          type: string
          description: Resolved auth provider name (empty if not an IdP login or the provider was deleted)
        errorCode:
          type: string
          description: Stable error code (empty on success), e.g. wrong_password, user_not_found, idp_code_exchange_failed
        errorDetail:
          type: string
          description: Raw error detail, e.g. the IdP's OAuth error response body (truncated to 2000 characters)
        device:
          type: string
          description: Parsed user agent, e.g. "Chrome on Windows 10/11"

    GetAuthAttemptListResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching events (for pagination)
        items:
          type: array
          items:
            $ref: "#/components/schemas/GetAuthAttemptResponse"

    # --- Settings ---
    SetSettingsRequest:
      type: object
      properties:
        value:
          type: string

    GetSettingsResponse:
      type: object
      properties:
        name:
          type: string
        value:
          type: string

    # --- Statistics ---
    GetStatsResponse:
      type: object
      properties:
        numUsers:
          type: integer
        numBookings:
          type: integer
        numLocations:
          type: integer
        numSpaces:
          type: integer
        numBookingsCurrent:
          type: integer
        numBookingsToday:
          type: integer
        numBookingsYesterday:
          type: integer
        numBookingsThisWeek:
          type: integer
        spaceLoadToday:
          type: integer
          description: Space load percentage for today
        spaceLoadYesterday:
          type: integer
          description: Space load percentage for yesterday
        spaceLoadThisWeek:
          type: integer
          description: Space load percentage for this week
        spaceLoadLastWeek:
          type: integer
          description: Space load percentage for last week

    # --- Search ---
    GetUserSearchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstname:
          type: string
        lastname:
          type: string

    GetLocationSearchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    GetSpaceSearchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          $ref: "#/components/schemas/GetLocationSearchResponse"

    GetGroupSearchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organizationId:
          type: string
          format: uuid

    GetSearchResultsResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/GetUserSearchResponse"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/GetLocationSearchResponse"
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/GetSpaceSearchResponse"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GetGroupSearchResponse"

    # --- Healthcheck ---
    HealthcheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        code:
          type: integer
        errors:
          type:
            - array
            - "null"
          items:
            type: string

    # --- CalDAV ---
    ListCaldavCalendarsRequest:
      type: object
      required: [url, username, password]
      properties:
        url:
          type: string
          format: uri
        username:
          type: string
        password:
          type: string

    ListCaldavCalendarsResponse:
      type: object
      properties:
        path:
          type: string
        name:
          type: string

  responses:
    Created:
      description: Object created successfully
      headers:
        X-Object-ID:
          schema:
            type: string
          description: ID of the created object
    Updated:
      description: Object updated or deleted successfully (204 No Content)
    BadRequest:
      description: Malformed request or incomplete JSON
      headers:
        X-Error-Code:
          schema:
            type: integer
          description: Custom error code (see error codes table)
    Unauthorized:
      description: JWT in Authorization header missing, expired, or invalid
    Forbidden:
      description: Authorized, but user has no access to requested resource
    NotFound:
      description: Object not found
    Conflict:
      description: Conflicting request (e.g. slot already booked)
    PaymentRequired:
      description: Feature not available (license/plan restriction)
    InternalServerError:
      description: Internal server error

paths:
  # ===========================
  # Authentication
  # ===========================
  /auth/login:
    post:
      tags: [Authentication]
      summary: Password login
      description: Authenticate a user with email and password. Returns JWT access and refresh tokens. Supports TOTP 2FA and passkey verification.
      operationId: loginPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWTResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: TOTP code required (user has 2FA enabled but code was not provided)
        "404":
          description: Invalid credentials or user not found

  /auth/passkey/login/begin:
    post:
      tags: [Authentication]
      summary: Begin passkey login
      description: Initiates a WebAuthn/passkey authentication flow. Returns a challenge that must be signed by the user's authenticator.
      operationId: beginPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginPasskeyLoginRequest"
      responses:
        "200":
          description: Passkey challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginPasskeyLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/passkey/login/finish:
    post:
      tags: [Authentication]
      summary: Finish passkey login
      description: Completes a WebAuthn/passkey authentication flow with the signed challenge. Returns JWT tokens on success.
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishPasskeyLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWTResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token and refresh token pair. The old refresh token is invalidated.
      operationId: refreshAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWTResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/verify/{id}:
    get:
      tags: [Authentication]
      summary: Verify OAuth/Atlassian login
      description: Retrieve JWT tokens after a successful OAuth or Atlassian SSO login. The `id` is the auth state ID received after the OAuth callback redirect.
      operationId: verifyLogin
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Auth state ID
      responses:
        "200":
          description: Login verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWTResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/{id}/login/{type}/:
    get:
      tags: [Authentication]
      summary: Initiate OAuth login
      description: Redirects the user to the OAuth provider's authorization page.
      operationId: oauthLogin
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Auth provider ID
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [web, app, ui]
          description: Login type (affects redirect URL after login)
        - name: redir
          in: query
          schema:
            type: string
          description: Optional redirect path after successful login
      responses:
        "307":
          description: Redirect to OAuth provider

  /auth/{id}/callback:
    get:
      tags: [Authentication]
      summary: OAuth callback
      description: Server-to-server callback endpoint used by the OAuth provider after user authorization. Not called directly by clients.
      operationId: oauthCallback
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Auth provider ID
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "307":
          description: Redirect to success or failure page

  /auth/singleorg:
    get:
      tags: [Authentication]
      summary: Get single organization details
      description: Returns organization details and available auth providers if the instance hosts exactly one organization. Returns 404 if there are multiple organizations.
      operationId: singleOrg
      security: []
      responses:
        "200":
          description: Single organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPreflightResponse"
        "404":
          description: Instance has multiple organizations
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/org/{domain}:
    get:
      tags: [Authentication]
      summary: Get organization details by domain
      description: Returns organization details and available auth providers for a domain. Used for the login preflight flow.
      operationId: getOrgDetails
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
          description: Organization domain
      responses:
        "200":
          description: Organization preflight data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPreflightResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/initpwreset:
    post:
      tags: [Authentication]
      summary: Initiate password reset
      description: Sends a password reset email to the user. Always returns 204 regardless of whether the user exists (to prevent user enumeration).
      operationId: initPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitPasswordResetRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Password login is disabled

  /auth/pwreset/{id}:
    post:
      tags: [Authentication]
      summary: Complete password reset
      description: Sets a new password using the password reset token received via email.
      operationId: completePasswordReset
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Password reset auth state ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/setpw/{id}:
    get:
      tags: [Authentication]
      summary: Validate user invitation link
      description: Checks if a user invitation link is still valid (password not yet set).
      operationId: validateUserInvitation
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Invitation auth state ID
      responses:
        "204":
          description: Invitation link is valid
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Password has already been set (link expired)
    post:
      tags: [Authentication]
      summary: Complete user invitation
      description: Sets the initial password for an invited user.
      operationId: completeUserInvitation
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Invitation auth state ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Password has already been set (link expired)

  /auth/logout/{where}:
    get:
      tags: [Authentication]
      summary: Logout
      description: |
        Terminates sessions. The `where` parameter determines which sessions to terminate:
        - `current`: Terminates only the current session
        - `all`: Terminates all sessions for the user
        - `{sessionId}`: Terminates a specific session by ID
      operationId: logout
      security:
        - BearerAuth: []
      parameters:
        - name: where
          in: path
          required: true
          schema:
            type: string
          description: "'current', 'all', or a specific session UUID"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Bookings
  # ===========================
  /booking/:
    get:
      tags: [Bookings]
      summary: Get own upcoming bookings
      description: Returns the authenticated user's upcoming bookings (bookings that haven't ended yet in the location's timezone).
      operationId: getOwnBookings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of upcoming bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetBookingResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Bookings]
      summary: Create a booking
      description: |
        Creates a new booking. Any user may book for themselves. Booking on behalf of someone else via `userEmail` requires `bookings` at full access; booking a disabled location or space requires `areas` at full access.
        Various validation checks are performed (max bookings, max days in advance, slot conflicts, etc.).
      operationId: createBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Slot conflict (space already booked for that time)
        "500":
          $ref: "#/components/responses/InternalServerError"

  /booking/{id}:
    get:
      tags: [Bookings]
      summary: Get a booking
      description: Returns a single booking by ID. Users can view their own; viewing another user's booking requires `bookings` at read level or above.
      operationId: getBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBookingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Bookings]
      summary: Update a booking
      description: Updates an existing booking. Users can update their own; updating another user's booking requires `bookings` at full access.
      operationId: updateBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Bookings]
      summary: Delete a booking
      description: Deletes a booking. Users can delete their own; deleting another user's booking requires `bookings` at full access. Respects the "max hours before delete" setting.
      operationId: deleteBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /booking/{id}/approve:
    post:
      tags: [Bookings]
      summary: Approve or decline a booking
      description: Approves or declines a pending booking. Requires `approvals` at full access.
      operationId: approveBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBookingApprovalRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /booking/{id}/ical:
    get:
      tags: [Bookings]
      summary: Download booking as iCal
      description: Downloads the booking as an iCalendar (.ics) file.
      operationId: getBookingIcal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: iCalendar file
          content:
            text/calendar:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /booking/precheck/:
    post:
      tags: [Bookings]
      summary: Pre-check booking creation
      description: Validates whether a booking can be created for the given time range and location without actually creating it. Useful for client-side validation.
      operationId: preBookingCreateCheck
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreCreateBookingRequest"
      responses:
        "204":
          description: Booking would be valid
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /booking/filter/:
    get:
      tags: [Bookings]
      summary: Get filtered bookings
      description: Returns bookings for an organization filtered by date range and optionally by user email. Requires `bookings` at read level or above.
      operationId: getFilteredBookings
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of date range (RFC 3339)
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of date range (RFC 3339)
        - name: user
          in: query
          schema:
            type: string
            format: email
          description: Filter by user email
      responses:
        "200":
          description: Filtered bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /booking/current/:
    get:
      tags: [Bookings]
      summary: Get current bookings
      description: Returns all currently active bookings for the organization. Requires `bookings` at read level or above.
      operationId: getCurrentBookings
      security:
        - BearerAuth: []
      parameters:
        - name: user
          in: query
          schema:
            type: string
            format: email
          description: Filter by user email
      responses:
        "200":
          description: Current bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /booking/pendingapprovals/count:
    get:
      tags: [Bookings]
      summary: Get pending approvals count
      description: Returns the number of bookings pending approval. Requires `approvals` at full access.
      operationId: getPendingApprovalsCount
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending approvals count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPendingApprovalsCountResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /booking/pendingapprovals/:
    get:
      tags: [Bookings]
      summary: Get pending approvals
      description: Returns all bookings pending approval. Requires `approvals` at full access.
      operationId: getPendingApprovals
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of pending bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetBookingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /booking/report/presence/:
    get:
      tags: [Bookings]
      summary: Get presence report
      description: Returns a presence report showing which users were present on which dates. Maximum date range is 31 days. Requires `analytics` at read level or above.
      operationId: getPresenceReport
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by location
      responses:
        "200":
          description: Presence report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPresenceReportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Recurring Bookings
  # ===========================
  /recurring-booking/:
    post:
      tags: [Recurring Bookings]
      summary: Create a recurring booking
      description: Creates a recurring booking series. Individual bookings are created for each occurrence. Returns the result for each occurrence indicating success or failure.
      operationId: createRecurringBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringBookingRequest"
      responses:
        "201":
          description: Recurring booking created
          headers:
            X-Object-ID:
              schema:
                type: string
              description: ID of the recurring booking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreateRecurringBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recurring-booking/precheck:
    post:
      tags: [Recurring Bookings]
      summary: Pre-check recurring booking creation
      description: Validates whether a recurring booking can be created without actually creating it. Returns the validation result for each planned occurrence.
      operationId: preCheckRecurringBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringBookingRequest"
      responses:
        "200":
          description: Validation results for each occurrence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreateRecurringBookingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /recurring-booking/{id}:
    get:
      tags: [Recurring Bookings]
      summary: Get a recurring booking
      description: Returns a single recurring booking by ID. Users can view their own; viewing another user's requires `bookings` at read level or above.
      operationId: getRecurringBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recurring booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRecurringBookingResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Recurring Bookings]
      summary: Delete a recurring booking
      description: Deletes a recurring booking and all its future individual bookings. Users can delete their own; deleting another user's requires `bookings` at full access.
      operationId: deleteRecurringBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /recurring-booking/{id}/ical:
    get:
      tags: [Recurring Bookings]
      summary: Download recurring booking as iCal
      description: Downloads all bookings of a recurring booking series as an iCalendar (.ics) file.
      operationId: getRecurringBookingIcal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: iCalendar file
          content:
            text/calendar:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Locations
  # ===========================
  /location/:
    get:
      tags: [Locations]
      summary: Get all locations
      description: Returns all locations in the user's organization.
      operationId: getAllLocations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetLocationResponse"
    post:
      tags: [Locations]
      summary: Create a location
      description: Creates a new location in the user's organization. Requires `areas` at full access.
      operationId: createLocation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/search:
    post:
      tags: [Locations]
      summary: Search locations
      description: Searches locations with optional attribute filters (e.g. number of free spaces, buddies on site). If no attributes are provided, returns all locations.
      operationId: searchLocations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchLocationRequest"
      responses:
        "200":
          description: Matching locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetLocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /location/loadsampledata:
    post:
      tags: [Locations]
      summary: Load sample data
      description: Creates sample locations and spaces for the organization. Requires `areas` at full access.
      operationId: loadSampleData
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sample data loaded
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{id}:
    get:
      tags: [Locations]
      summary: Get a location
      description: Returns a single location by ID.
      operationId: getLocation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Location details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLocationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Locations]
      summary: Update a location
      description: Updates an existing location. Requires `areas` at full access.
      operationId: updateLocation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Locations]
      summary: Delete a location
      description: Deletes a location and all its spaces. Requires `areas` at full access.
      operationId: deleteLocation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /location/{id}/map:
    get:
      tags: [Locations]
      summary: Get location map
      description: Returns the floor plan / map image for a location as base64-encoded data.
      operationId: getLocationMap
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMapResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Locations]
      summary: Upload location map
      description: Uploads or replaces the floor plan / map image for a location. Accepts PNG, JPEG, GIF, or SVG. Requires `areas` at full access.
      operationId: setLocationMap
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /location/{id}/attribute:
    get:
      tags: [Locations]
      summary: Get location attribute values
      description: Returns all attribute values set on a location.
      operationId: getLocationAttributes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Location attribute values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSpaceAttributeValueResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /location/{id}/attribute/{attributeId}:
    post:
      tags: [Locations]
      summary: Set location attribute value
      description: Sets an attribute value on a location. Only attributes marked as `locationApplicable` can be set. Requires `areas` at full access.
      operationId: setLocationAttribute
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attributeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSpaceAttributeValueRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Locations]
      summary: Delete location attribute value
      description: Removes an attribute value from a location. Requires `areas` at full access.
      operationId: deleteLocationAttribute
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attributeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Spaces
  # ===========================
  /location/{locationId}/space/:
    get:
      tags: [Spaces]
      summary: Get all spaces in a location
      description: Returns all spaces in a location with their attributes, approvers, and allowed bookers.
      operationId: getAllSpaces
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSpaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Spaces]
      summary: Create a space
      description: Creates a new space in a location. Requires `areas` at full access.
      operationId: createSpace
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/{id}:
    get:
      tags: [Spaces]
      summary: Get a space
      description: Returns a single space by ID with its attributes, approvers, and allowed bookers.
      operationId: getSpace
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Space details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSpaceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Spaces]
      summary: Update a space
      description: Updates an existing space. Requires `areas` at full access.
      operationId: updateSpace
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Spaces]
      summary: Delete a space
      description: Deletes a space. Requires `areas` at full access.
      operationId: deleteSpace
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /location/{locationId}/space/availability:
    get:
      tags: [Spaces]
      summary: Get space availability
      description: |
        Returns all spaces in a location with their availability and current bookings for a time range.
        If `enter` and `leave` are omitted, returns availability for right now.
        Optionally filter by `attributes` (JSON-encoded search attributes).
      operationId: getSpaceAvailability
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: enter
          in: query
          schema:
            type: string
            format: date-time
          description: Start of time range (RFC 3339). Must be provided together with `leave`.
        - name: leave
          in: query
          schema:
            type: string
            format: date-time
          description: End of time range (RFC 3339). Must be provided together with `enter`.
        - name: attributes
          in: query
          schema:
            type: string
          description: JSON-encoded array of SearchAttribute objects for filtering
      responses:
        "200":
          description: Space availability data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSpaceAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/{id}/availability:
    get:
      tags: [Spaces]
      summary: Get single space availability
      description: Returns availability and current bookings for a single space in a time range.
      operationId: getSingleSpaceAvailability
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: enter
          in: query
          schema:
            type: string
            format: date-time
        - name: leave
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Space availability data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSpaceAvailabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/bulk:
    post:
      tags: [Spaces]
      summary: Bulk create/update/delete spaces
      description: Performs bulk operations on spaces in a location. Allows creating, updating, and deleting multiple spaces in a single request. Requires `areas` at full access.
      operationId: bulkUpdateSpaces
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceBulkUpdateRequest"
      responses:
        "200":
          description: Bulk operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/{id}/approver:
    get:
      tags: [Spaces]
      summary: Get approver groups for a space
      description: Returns all groups that can approve bookings for this space. Requires `areas` at full access.
      operationId: getSpaceApprovers
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of approver groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetGroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Spaces]
      summary: Add approver groups to a space
      description: Adds groups as approvers for bookings on this space. Requires `areas` at full access.
      operationId: addSpaceApprovers
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Array of group IDs to add as approvers
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/{id}/approver/remove:
    post:
      tags: [Spaces]
      summary: Remove approver groups from a space
      description: Removes groups from the list of approvers for this space. Requires `areas` at full access.
      operationId: removeSpaceApprovers
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Array of group IDs to remove as approvers
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/{id}/allowedbooker:
    get:
      tags: [Spaces]
      summary: Get allowed booker groups for a space
      description: Returns all groups whose members are allowed to book this space. If empty, all users can book. Requires `areas` at full access.
      operationId: getAllowedBookers
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of allowed booker groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetGroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Spaces]
      summary: Add allowed booker groups to a space
      description: Adds groups whose members are allowed to book this space. Requires `areas` at full access.
      operationId: addAllowedBookers
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Array of group IDs to add as allowed bookers
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /location/{locationId}/space/{id}/allowedbooker/remove:
    post:
      tags: [Spaces]
      summary: Remove allowed booker groups from a space
      description: Removes groups from the allowed booker list for this space. Requires `areas` at full access.
      operationId: removeAllowedBookers
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Array of group IDs to remove from allowed bookers
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================
  # Space Attributes
  # ===========================
  /space-attribute/:
    get:
      tags: [Space Attributes]
      summary: Get all space attributes
      description: Returns all space attribute definitions for the user's organization.
      operationId: getAllSpaceAttributes
