      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Organizations
  # ===========================
  /organization/{id}:
    get:
      tags: [Organizations]
      summary: Get an organization
      description: Returns a single organization by ID. Requires `org_settings` at full access.
      operationId: getOrganization
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrganizationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Organizations]
      summary: Update an organization
      description: |
        Updates an organization's details. Requires `org_settings` at full access.
        Changing the contact email always sends a verification email; the response then includes a `verifyUuid`.
      operationId: updateOrganization
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "200":
          description: Update result (includes verifyUuid if email verification is needed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrgEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Organizations]
      summary: Request organization deletion
      description: |
        Initiates the organization deletion process. Sends a confirmation email with a 6-digit code.
        The deletion must be confirmed via the `/organization/deleteorg/{id}` endpoint.
        Requires `org_settings` at full access.
      operationId: deleteOrganization
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deletion confirmation code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteOrgResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/deleteorg/{id}:
    post:
      tags: [Organizations]
      summary: Complete organization deletion
      description: Confirms and completes an organization deletion by providing the 6-digit code received via email. No authentication required (whitelisted route).
      operationId: completeOrgDeletion
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Auth state ID from the deletion confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOrgDeletionRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/domain/{domain}:
    get:
      tags: [Organizations]
      summary: Get organization for domain
      description: Returns the organization associated with a domain. No authentication required (whitelisted route).
      operationId: getOrgForDomain
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrganizationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/domain/verify/{domain}:
    get:
      tags: [Organizations]
      summary: Get domain accessibility token
      description: Returns domain accessibility information for a domain. No authentication required (whitelisted route).
      operationId: getDomainAccessibilityToken
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain accessibility information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainAccessibilityPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/{id}/domain/:
    get:
      tags: [Organizations]
      summary: Get all domains for an organization
      description: Returns all domains configured for an organization. Requires `org_settings` at full access.
      operationId: getDomains
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetDomainResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/{id}/domain/{domain}:
    post:
      tags: [Organizations]
      summary: Add a domain to an organization
      description: Adds a new domain to an organization. The domain must be verified via DNS TXT record before it becomes active. Requires `org_settings` at full access. Requires the Custom Domains feature.
      operationId: addDomain
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Organizations]
      summary: Remove a domain from an organization
      description: Removes a domain from an organization. Seatsurfing signup domains (*.seatsurfing.app) cannot be removed. Requires `org_settings` at full access.
      operationId: removeDomain
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/{id}/domain/{domain}/verify:
    post:
      tags: [Organizations]
      summary: Verify a domain via DNS TXT record
      description: Verifies domain ownership by checking for the expected DNS TXT record. Activates the domain on success. Requires `org_settings` at full access.
      operationId: verifyDomain
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          description: DNS TXT record verification failed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organization/{id}/domain/{domain}/primary:
    post:
      tags: [Organizations]
      summary: Set primary domain
      description: Sets a domain as the primary domain for an organization. Requires `org_settings` at full access.
      operationId: setPrimaryDomain
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organization/{id}/verifyemail/{uuid}:
    post:
      tags: [Organizations]
      summary: Verify email address change
      description: Verifies a contact email address change by providing the 6-digit code that was sent to the new email address. Requires `org_settings` at full access.
      operationId: verifyEmail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Verification state ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailAddressVerifyRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Users
  # ===========================
  /user/:
    get:
      tags: [Users]
      summary: Get all users
      description: Returns all users of the organization. Supports search via `q` query parameter. Requires `users` at read level or above.
      operationId: getAllUsers
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search keyword to filter users by email, first name, or last name
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create a user
      description: |
        Creates a new user in the organization. Requires `users` at full access. Authentication method is determined by the request:
        - Set `sendInvitation: true` to send an email invitation for the user to set their own password
        - Set `password` to create a user with a specific password
        - Set `authProviderId` to bind the user to an OAuth provider
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: User with this email already exists

  /user/me:
    get:
      tags: [Users]
      summary: Get own user details
      description: Returns the authenticated user's details including organization information.
      operationId: getSelf
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserSelfResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/count:
    get:
      tags: [Users]
      summary: Get user count
      description: Returns the total number of users in the organization. Requires `users` at read level or above.
      operationId: getUserCount
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserCountResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /user/session:
    get:
      tags: [Users]
      summary: Get active sessions
      description: Returns all active sessions for the authenticated user.
      operationId: getActiveSessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/{id}:
    get:
      tags: [Users]
      summary: Get a user
      description: Returns a single user by ID. Requires `users` at read level or above. User must belong to the same organization.
      operationId: getUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user
      description: Updates a user's details. Requires `users` at full access.
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Users]
      summary: Delete a user
      description: Deletes a user. Requires `users` at full access. Cannot delete yourself.
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/{id}/password:
    put:
      tags: [Users]
      summary: Set user password
      description: Sets a user's password. Users can set their own; setting another user's password requires `users` at full access. All sessions are terminated after a password change. Use `me` as the ID to set your own password.
      operationId: setPassword
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID (UUID) or "me" for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /user/{id}/passkeys:
    delete:
      tags: [Users]
      summary: Admin reset passkeys
      description: Removes all passkeys for a user. Requires `users` at full access.
      operationId: adminResetPasskeys
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/{id}/api-token:
    get:
      tags: [Users]
      summary: Get API token status
      description: Returns whether a long-lived API token is currently configured for the specified service account. The raw token is never returned. Requires `service_accounts` at full access.
      operationId: getApiTokenStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Service account user ID
      responses:
        "200":
          description: API token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApiTokenStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Users]
      summary: Generate API token
      description: |
        Generates a new long-lived API token for the specified service account.
        The raw token is returned **once** in the response and is not stored in plaintext.
        Calling this endpoint again immediately invalidates the previous token.
        The token can be used as `Authorization: Bearer <token>` on any endpoint that accepts service account credentials.
        Requires `service_accounts` at full access.
      operationId: generateApiToken
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Service account user ID
      responses:
        "200":
          description: Generated API token (shown once only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateApiTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Revoke API token
      description: Revokes the API token for the specified service account. The token stops working immediately. This operation is idempotent (returns 204 even if no token was configured). Requires `service_accounts` at full access.
      operationId: revokeApiToken
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Service account user ID
      responses:
        "204":
          description: Token revoked (or was not set)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/{id}/totp:
    delete:
      tags: [Users]
      summary: Admin reset TOTP
      description: Disables TOTP 2FA for a user. Requires `users` at full access.
      operationId: adminResetTotp
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/byEmail/{email}:
    get:
      tags: [Users]
      summary: Get user by email
      description: Returns a user by email address. Only available when name visibility is enabled (showNames setting) or with `users` at read level or above. Cannot look up your own email.
      operationId: getUserByEmail
      security:
        - BearerAuth: []
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/totp/generate:
    get:
      tags: [Users]
      summary: Generate TOTP setup QR code
      description: Generates a TOTP secret and returns a QR code image for setting up 2FA. The setup must be completed by calling the validate endpoint within 5 minutes.
      operationId: generateTotp
      security:
        - BearerAuth: []
      responses:
        "200":
          description: TOTP setup data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTotpResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /user/totp/{stateId}/secret:
    get:
      tags: [Users]
      summary: Get TOTP secret for manual entry
      description: Returns the TOTP secret key for manual entry (as an alternative to scanning the QR code). Rate limited.
      operationId: getTotpSecret
      security:
        - BearerAuth: []
      parameters:
        - name: stateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: TOTP secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTotpSecretResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many requests

  /user/totp/validate:
    post:
      tags: [Users]
      summary: Validate TOTP and enable 2FA
      description: Validates a TOTP code against the pending setup and enables 2FA for the user if valid. Rate limited to 5 attempts per setup.
      operationId: validateTotp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTotpRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          description: Invalid TOTP code
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many attempts

  /user/totp/disable:
    post:
      tags: [Users]
      summary: Disable TOTP 2FA
      description: Disables TOTP 2FA for the authenticated user. Blocked if TOTP enforcement is enabled for the organization.
      operationId: disableTotp
      security:
        - BearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: TOTP enforcement is enabled

  /user/passkey/:
    get:
      tags: [Users]
      summary: List passkeys
      description: Returns all passkeys registered for the authenticated user.
      operationId: listPasskeys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyListItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /user/passkey/registration/begin:
    post:
      tags: [Users]
      summary: Begin passkey registration
      description: Starts WebAuthn passkey registration. Requires the user to have a password set and not be bound to an OAuth provider. Limited to a configurable maximum number of passkeys per user.
      operationId: beginPasskeyRegistration
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Registration challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginPasskeyRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User does not meet passkey prerequisites or limit reached

  /user/passkey/registration/finish:
    post:
      tags: [Users]
      summary: Complete passkey registration
      description: Completes the WebAuthn passkey registration with the authenticator's response.
      operationId: finishPasskeyRegistration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishPasskeyRegistrationRequest"
      responses:
        "200":
          description: Passkey registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyListItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /user/passkey/{id}:
    put:
      tags: [Users]
      summary: Rename a passkey
      description: Changes the display name of a passkey.
      operationId: renamePasskey
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Delete a passkey
      description: Deletes a passkey. Users can only delete their own passkeys.
      operationId: deletePasskey
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/merge/init:
    post:
      tags: [Users]
      summary: Initiate user merge
      description: Initiates a merge request from the authenticated user to the target user (identified by email). The target user must confirm the merge.
      operationId: mergeInit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitMergeUsersRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/merge/finish/{id}:
    post:
      tags: [Users]
      summary: Complete user merge
      description: Confirms and completes a merge request. Merges the source user into the authenticated (target) user.
      operationId: mergeFinish
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Merge request auth state ID
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/merge:
    get:
      tags: [Users]
      summary: Get pending merge requests
      description: Returns all pending merge requests targeting the authenticated user.
      operationId: getMergeRequests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of merge requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetMergeRequestResponse"

  /auth-provider/{id}/mapping:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Auth Providers]
      summary: Get a provider's role and group mappings
      description: Returns the claim-to-role and claim-to-group mappings of an auth provider. Requires `auth_providers` at full access.
      operationId: getAuthProviderMappings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthProviderMapping"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Auth Providers]
      summary: Set a provider's role and group mappings
      description: |
        Replaces the auth provider's mappings. Requires `auth_providers` at full access and
        `roles` at full access. Every target must belong to the same organization, and a mapping
        may not grant a role the caller could not grant directly (error code 7002).

        Mappings are applied on every login through the provider. Assignments they made are
        replaced; roles and group memberships assigned by hand are left untouched. A
        reconciliation that would leave the organization without an administrator is skipped and
        logged rather than applied.
      operationId: setAuthProviderMappings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mappings:
                  type: array
                  items:
                    $ref: "#/components/schemas/AuthProviderMapping"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Roles
  # ===========================
  /role/permissions:
    get:
      tags: [Roles]
      summary: Get the permission catalogue
      description: |
        Returns every permission that can be granted, including those contributed by installed
        plugins, together with the levels each one offers. Available to any authenticated user:
        it describes the model, not the caller's own access.
      operationId: getPermissionCatalogue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The permission catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetPermissionDefinitionResponse"

  /role/:
    get:
      tags: [Roles]
      summary: Get all roles
      description: Returns all roles defined in the organization. Requires `roles` at read level or above.
      operationId: getAllRoles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetRoleResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Roles]
      summary: Create a role
      description: |
        Creates a role. Requires `roles` at full access. A role may not grant a level the caller
        does not hold themselves (error code 7002), and each permission accepts only the levels
        it declares.
      operationId: createRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /role/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: Get a role
      description: Returns a single role. Requires `roles` at read level or above.
      operationId: getRole
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRoleResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Roles]
      summary: Update a role
      description: |
        Updates a role. Requires `roles` at full access. The built-in administrator role cannot be
        changed (error code 7003), and a change that would leave the organization without an
        administrator is refused (error code 7001).
      operationId: updateRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Roles]
      summary: Delete a role
      description: |
        Deletes a role and every assignment of it. Requires `roles` at full access. The built-in
        administrator role cannot be deleted (error code 7003), and a deletion that would leave
        the organization without an administrator is refused (error code 7001).
      operationId: deleteRole
      security:
        - BearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /role/{id}/users:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: Get the users holding a role
      description: Returns the IDs of the users this role is assigned to. Requires `roles` at full access.
      operationId: getRoleUsers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of user IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: Get a user's roles
      description: Returns the IDs of the roles assigned to a user. Requires `roles` at read level or above.
      operationId: getUserRoles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of role IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Roles]
      summary: Set a user's roles
      description: |
        Replaces the roles assigned to a user by an administrator. Assignments made by an identity
        provider are left untouched, so that reconciliation on the user's next login still governs
        those. Requires `roles` at full access.

        Refused when the caller does not hold everything the roles grant (7002), when it would
        remove the caller's own ability to manage roles (7004), or when it would leave the
        organization without an administrator (7001). A refused request changes nothing.
      operationId: setUserRoles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: Get a user's resolved access
      description: |
        Returns the access a user actually has, resolved across every role they hold. Requires
        `roles` at read level or above, or the user asking about themselves.
      operationId: getUserPermissions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The resolved permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    $ref: "#/components/schemas/PermissionMap"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Groups
  # ===========================
  /group/:
    get:
      tags: [Groups]
      summary: Get all groups
      description: Returns all groups in the organization. Requires `groups` at read level or above.
      operationId: getAllGroups
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetGroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Groups]
      summary: Create a group
      description: Creates a new group in the organization. Requires `groups` at full access. Requires the Groups feature.
      operationId: createGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /group/{id}:
    get:
      tags: [Groups]
      summary: Get a group
      description: Returns a single group by ID. Requires `groups` at read level or above.
      operationId: getGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGroupResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Groups]
      summary: Update a group
      description: Updates a group's name. Requires `groups` at full access.
      operationId: updateGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Groups]
      summary: Delete a group
      description: Deletes a group. Requires `groups` at full access.
      operationId: deleteGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /group/{id}/member:
    get:
      tags: [Groups]
      summary: Get group members
      description: Returns all users that are members of a group. Requires `groups` at read level or above.
      operationId: getGroupMembers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of member users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Groups]
      summary: Add members to a group
      description: Adds users to a group by their user IDs. Requires `groups` at limited level or above. All users must exist and belong to the same organization.
      operationId: addGroupMembers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Array of user IDs to add
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /group/{id}/member/remove:
    post:
      tags: [Groups]
      summary: Remove members from a group
      description: Removes users from a group by their user IDs. Requires `groups` at limited level or above.
      operationId: removeGroupMembers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Array of user IDs to remove
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Buddies
  # ===========================
  /buddy/:
    get:
      tags: [Buddies]
      summary: Get all buddies
      description: Returns all buddies for the authenticated user, including their next booking details.
      operationId: getAllBuddies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of buddies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetBuddyResponse"
    post:
      tags: [Buddies]
      summary: Add a buddy
      description: Adds a user as a buddy. The buddy must be in the same organization.
      operationId: createBuddy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuddyRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /buddy/{id}:
    delete:
      tags: [Buddies]
      summary: Remove a buddy
      description: Removes a buddy relationship. Users can only remove their own buddies.
      operationId: deleteBuddy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Auth Providers
  # ===========================
  /auth-provider/:
    get:
      tags: [Auth Providers]
      summary: Get all auth providers
      description: Returns all authentication providers for the organization. Requires `auth_providers` at full access.
      operationId: getAllAuthProviders
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of auth providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetAuthProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Auth Providers]
      summary: Create an auth provider
      description: Creates a new OAuth/OIDC authentication provider. Requires `auth_providers` at full access. Requires the Auth Providers feature.
      operationId: createAuthProvider
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthProviderRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth-provider/{id}:
    get:
      tags: [Auth Providers]
      summary: Get an auth provider
      description: Returns a single authentication provider by ID. Requires `auth_providers` at full access.
      operationId: getAuthProvider
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Auth provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAuthProviderResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Auth Providers]
      summary: Update an auth provider
      description: Updates an authentication provider. Read-only providers cannot be updated. Requires `auth_providers` at full access.
      operationId: updateAuthProvider
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthProviderRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Auth Providers]
      summary: Delete an auth provider
      description: Deletes an authentication provider. Read-only providers cannot be deleted. Cannot delete providers that have users bound to them. Requires `auth_providers` at full access.
      operationId: deleteAuthProvider
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          description: Provider has users bound to it
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth-provider/org/{id}:
    get:
      tags: [Auth Providers]
      summary: Get public auth providers for organization
      description: Returns the public auth provider information (ID and name only) for an organization. No authentication required (whitelisted route).
      operationId: getPublicAuthProviders
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Organization ID
      responses:
        "200":
          description: List of public auth providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetAuthProviderPublicResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================
  # Auth Events
  # ===========================

  /auth-attempt/:
    get:
      tags: [Auth Events]
      summary: List authentication events
      description: Returns recorded login attempts (successes and failures) for the caller's organization, newest first. Requires `audit_log` at read level or above.
      operationId: getAuthAttempts
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema:
            type: string
            format: date-time
          description: Range start (RFC3339). Defaults to end minus 7 days.
        - name: end
          in: query
          schema:
            type: string
            format: date-time
          description: Range end (RFC3339). Defaults to now.
        - name: user
          in: query
          schema:
            type: string
          description: Case-insensitive email substring filter
        - name: method
          in: query
          schema:
            type: string
            enum: [password, totp, passkey, passkey_2fa, oauth, confluence]
          description: Filter by authentication method
        - name: success
          in: query
          schema:
            type: boolean
          description: Filter by outcome (omit for both)
        - name: errorCode
          in: query
          schema:
            type: string
          description: Filter by stable error code
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of authentication events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAuthAttemptListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================
  # Settings
  # ===========================
  /setting/:
    get:
      tags: [Settings]
      summary: Get all settings
      description: |
        Returns all organization settings visible to the current user.
        Users see public settings; `org_settings` at full access additionally returns admin settings.
        Plugin menu items are returned filtered by the permission each plugin declares for them.
        Also includes system settings and plugin settings.
      operationId: getAllSettings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSettingsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Settings]
      summary: Update all settings
      description: Updates multiple settings at once. Requires `org_settings` at full access.
      operationId: setAllSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GetSettingsResponse"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invalid setting name
        "409":
          $ref: "#/components/responses/Conflict"

  /setting/{name}:
    get:
      tags: [Settings]
      summary: Get a setting
      description: Returns a single setting by name. Access depends on the setting type (public vs admin).
      operationId: getSetting
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Setting name
      responses:
        "200":
          description: Setting value
          content:
            application/json:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Settings]
      summary: Update a setting
      description: Updates a single setting by name. Requires `org_settings` at full access.
      operationId: setSetting
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Setting name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSettingsRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invalid setting name
        "409":
          $ref: "#/components/responses/Conflict"

  /setting/timezones:
    get:
      tags: [Settings]
      summary: Get available timezones
      description: Returns the list of all available IANA timezones.
      operationId: getTimezones
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of timezone identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ===========================
  # User Preferences
  # ===========================
  /preference/:
    get:
      tags: [User Preferences]
      summary: Get all user preferences
      description: Returns all preferences for the authenticated user.
      operationId: getAllPreferences
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of user preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetSettingsResponse"
    put:
      tags: [User Preferences]
      summary: Update all user preferences
      description: Updates multiple user preferences at once.
      operationId: setAllPreferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GetSettingsResponse"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Invalid preference name

  /preference/{name}:
    get:
      tags: [User Preferences]
      summary: Get a user preference
      description: Returns a single user preference by name.
      operationId: getPreference
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preference value
          content:
            application/json:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [User Preferences]
      summary: Update a user preference
      description: Updates a single user preference by name. Encrypted preferences (e.g. CalDAV password) are encrypted before storage.
      operationId: setPreference
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSettingsRequest"
      responses:
        "204":
          $ref: "#/components/responses/Updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Invalid preference name

  /preference/caldav/listCalendars:
    post:
      tags: [User Preferences]
      summary: List CalDAV calendars
      description: Connects to a CalDAV server and lists available calendars. Used for configuring CalDAV integration. Requires the CRYPT_KEY environment variable to be set.
      operationId: caldavListCalendars
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCaldavCalendarsRequest"
      responses:
        "200":
          description: List of calendars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListCaldavCalendarsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Could not connect to CalDAV server

  # ===========================
  # Statistics
  # ===========================
  /stats/:
    get:
      tags: [Statistics]
      summary: Get organization statistics
      description: Returns statistics for the organization including user count, booking count, space load, and more. Requires `analytics` at read level or above.
      operationId: getStats
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================
  # Search
  # ===========================
  /search/:
    get:
      tags: [Search]
      summary: Search across entities
      description: |
        Searches across users, locations, spaces, and groups by keyword. Requires `users` at read level or above.
        Use query parameters to control which entity types to include in the search:
        - `includeUsers=1` (requires `users` at read level or above)
        - `includeGroups=1`
        - `includeLocations=1`
        - `includeSpaces=1`
        To expand the location object (in the spaces result), use the expand query parameter:
        - `expandLocations=1`
      operationId: search
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Search keyword
        - name: includeUsers
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: Include users in search results
        - name: includeGroups
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: Include groups in search results
        - name: includeLocations
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: Include locations in search results
        - name: includeSpaces
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: Include spaces in search results
        - name: expandLocations
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: Expand the location object in search results
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSearchResultsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================
  # Confluence
  # ===========================
  /confluence/{orgID}/{jwt}:
    get:
      tags: [Confluence]
      summary: Confluence server SSO login
      description: Authenticates a user via Atlassian Confluence Server JWT. Redirects to the booking UI on success. No direct authentication required (whitelisted route).
      operationId: confluenceServerLogin
      security: []
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Organization ID
        - name: jwt
          in: path
          required: true
          schema:
            type: string
          description: JWT signed with the Confluence shared secret
      responses:
        "307":
          description: Redirect to booking UI (success or failure page)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Organization not found (plain text response)

  # ===========================
  # Healthcheck
  # ===========================
  /healthcheck:
    get:
      tags: [Healthcheck]
      summary: Application health check
      description: Returns the health status of the application, including database connectivity. No authentication required (whitelisted route).
      operationId: healthcheck
      security: []
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckResponse"
        "503":
          description: Application is unhealthy (e.g. database connection error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckResponse"
    head:
      tags: [Healthcheck]
      summary: Application health check (HEAD)
      description: Same as GET but without response body. Useful for monitoring systems.
      operationId: healthcheckHead
      security: []
      responses:
        "200":
          description: Application is healthy
        "503":
          description: Application is unhealthy

  # ===========================
  # Update Check
  # ===========================
  /uc/:
    get:
      tags: [Update Check]
      summary: Check for updates
      description: Returns the latest available version information if an update is available. Requires authentication.
      operationId: checkUpdate
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Update information
          content:
            application/json:
              schema:
                type: object
        "404":
          description: No update available
